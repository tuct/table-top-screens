# GENERATED by tools/gen_video_cache.py -- do not edit by hand.
# Regenerate with a different frame count:  python tools/gen_video_cache.py N
#
# Caches 40 pre-decoded frames in PSRAM and plays them back as pure blits.
#
# Why this is fast: the per-frame HTTP fetch is gone, and so is the JPEG
# decode. Both happen once, while loading. Playback is then one bulk
# draw_pixels_at() per frame straight out of PSRAM, which leaves only the
# panel transfer -- 240x240x2 bytes at 20 MHz = 46 ms, so ~21 fps is the
# hardware ceiling.
#
# Memory: 40 x ${display_width}*${display_height}*2 bytes. At 240x240 that is
# 40 x 115,200 = 4.39 MB of the 8 MB PSRAM. Raise N until that stops
# being comfortable; the XIAO also needs PSRAM for WiFi buffers and the heap.
#
# Requires common/content-pull.yaml (for content_url and the display), and
# must be listed after it so the capability below overrides its default.

substitutions:
  anim_formats: gif,apng,webp

globals:
  - id: clip_loading
    type: bool
    restore_value: false
    initial_value: 'false'

  - id: clip_in_flight
    type: bool
    restore_value: false
    initial_value: 'false'

  # How many slots have been filled this load. Doubles as the next index to
  # request, so loading is just "fetch slot clip_loaded".
  - id: clip_loaded
    type: int
    restore_value: false
    initial_value: '0'

  - id: clip_frames
    type: int
    restore_value: false
    initial_value: '0'

  - id: clip_play_index
    type: int
    restore_value: false
    initial_value: '0'

  - id: clip_error
    type: bool
    restore_value: false
    initial_value: 'false'

  - id: clip_last_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

image:
  - platform: online_image
    id: f00
    url: http://127.0.0.1/frame-cache-slot
    format: JPEG
    type: RGB565
    byte_order: BIG_ENDIAN
    resize: ${display_width}x${display_height}
    update_interval: never
    buffer_size: 32768
    on_download_finished:
      - lambda: |-
          id(clip_in_flight) = false;
          id(clip_loaded)++;
    on_error:
      - lambda: |-
          id(clip_in_flight) = false;
          id(clip_error) = true;

  - platform: online_image
    id: f01
