# SD card over SPI, using components/sd_spi.
#
# Not the SDMMC component (n-serrette/esphome_sd_card): that drives the SDMMC
# peripheral, and neither board here can use it --
#
#   * Seeed round display: its card shares the LCD's SPI pins, so SDMMC would
#     have to take those pins away from the panel.
#   * Waveshare 4.3: its card is on free pins, but the chip select is on an
#     I2C expander. An SD card latches SPI-vs-SD mode from the CS level at its
#     first CMD0 after power-up, and that pin idles LOW long before I2C is
#     initialised -- so the card is already in SPI mode before anything could
#     drive it high. Tried it; "Failed to mount card".
#
# The board package must declare:
#   sd_spi_bus_id   the SPI bus the card is on
#   sd_cs_pin       chip select: a GPIO number, or "none" when the board holds
#                   it asserted itself (the Waveshare, via CH422G EXIO4)

# Tells the server this screen has a card, so it asks about it -- size, free
# space, and whether stills are being kept there. Must be listed AFTER
# content-pull in the device file, so this wins over its default of "0".
substitutions:
  sd_card: "1"

external_components:
  - source:
      type: local
      path: components
    components: [sd_spi]

sd_spi:
  id: sd
  spi_host: ${sd_spi_host}
  cs_pin: ${sd_cs_pin}
  mount_point: /sd
  # Never reformat on a failed mount: a failure here is far more likely to be
  # wiring or chip select than a genuinely unformatted card, and the recovery
  # for that must not be "erase the user's card".
  format_if_mount_failed: false

button:
  # Press this first after flashing: it proves the card mounted AND that a
  # directory read works, before anything depends on it.
  - platform: template
    name: SD List Root
    id: sd_list_root
    on_press:
      - lambda: |-
          if (!id(sd)->is_mounted()) {
            ESP_LOGW("sd", "not mounted");
            return;
          }
          auto entries = id(sd)->list_directory("/", 32);
          ESP_LOGI("sd", "%u entries in /", (unsigned) entries.size());
          for (auto &e : entries)
            ESP_LOGI("sd", "  %s (%u bytes)", e.c_str(),
                     (unsigned) id(sd)->file_size("/" + e));

binary_sensor:
  - platform: template
    name: SD Mounted
    id: sd_mounted
    entity_category: diagnostic
    lambda: 'return id(sd)->is_mounted();'

  # Whether stills are actually being stored on and shown from the card right
  # now (common/sd-still.yaml, with a card mounted). Entity NAMES "SD Mounted",
  # "SD In Use", "SD Total" and "SD Free" are read by the server
  # (discovery.py SD_STATE_PATHS); rename them there too.
  - platform: template
    name: SD In Use
    id: sd_in_use
    entity_category: diagnostic
    lambda: 'return id(still_to_sd);'

# Megabytes, not bytes: web_server reports a float, which cannot hold a 32 GB
# byte count exactly. Rarely polled -- see SdSpi::space() -- and refreshed by
# the interval below as soon as a card mounts.
sensor:
  - platform: template
    name: SD Total
    id: sd_total_mb
    unit_of_measurement: MB
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      uint64_t total, free;
      if (!id(sd)->space(total, free)) return NAN;
      return total / (1024.0f * 1024.0f);

  - platform: template
    name: SD Free
    id: sd_free_mb
    unit_of_measurement: MB
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      uint64_t total, free;
      if (!id(sd)->space(total, free)) return NAN;
      return free / (1024.0f * 1024.0f);

# One line for the boot checklist, built from the sensors above so the display
# never waits on the card. Requires common/content-pull.yaml (sd_status,
# still_to_sd).
interval:
  - interval: 2s
    then:
      - lambda: |-
          if (!id(sd)->is_mounted()) {
            id(sd_status) = "no card";
            return;
          }
          // First reading right after a (possibly late) mount, instead of
          // waiting up to a minute for the sensors' own interval.
          if (std::isnan(id(sd_total_mb).state)) {
            id(sd_total_mb).update();
            id(sd_free_mb).update();
          }
          const char *use = id(still_to_sd) ? "stills on card" : "mounted, unused";
          char buf[64];
          if (std::isnan(id(sd_total_mb).state)) {
            snprintf(buf, sizeof(buf), "%s", use);
          } else {
            snprintf(buf, sizeof(buf), "%s, %.1f of %.1f GB free", use,
                     id(sd_free_mb).state / 1024.0f, id(sd_total_mb).state / 1024.0f);
          }
          id(sd_status) = buf;
