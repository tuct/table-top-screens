# Shared plumbing for every mini screen: connectivity + control surfaces.
# Board-independent on purpose.

# The task watchdog, and why it is not the one that had to change.
#
# Fetching happens on loopTask and blocks it: connect, headers, then a chunk
# per tick. When the server moved to a new DHCP address, tabletop-03 blocked
# on the stale one, the watchdog killed it at 5 s mid-connect, it rebooted,
# fetched the same stale URL on boot, and looped -- never reaching the backoff
# that exists for exactly this (mjpeg-clip.yaml ITEM_FAILED: 2s, 4s, 6s, then
# 30s doubling to 5 min).
#
# The real fix is in components/sd_clip: it unsubscribes loopTask from the
# watchdog around each blocking HTTP call, so the short fuse stays on
# everything else. This is only the floor for the paths that are not ours --
# online_image's fallback fetch decodes for ~1.9 s after a download that
# http_request bounds at 10 s. 15 s clears that with room.
#
# Merges with each board's own esp32 block.
esp32:
  framework:
    sdkconfig_options:
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "15"

logger:
  level: DEBUG   # bring-up: show component setup + dump_config

#api:
#  encryption:
#    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # fast_connect is deliberately OFF. It was added when the configured SSID
  # looked hidden; in fact that SSID simply was not in range, and the one in
  # use is visible with three BSSIDs (a mesh). With fast_connect on, the saved
  # BSSID is tried first and -- once that AP is no longer the best or has
  # roamed -- fails, costing ~24s of retries before a scan finds a good one.
  # Turn it on only for a genuinely hidden SSID or a single-AP network.
  # fast_connect: true

  # Mains-powered screen that must react to pushes promptly, so don't let the
  # radio sleep between beacons.
  power_save_mode: none

  ap:
    ssid: ${device_name}-setup
    password: !secret wifi_ap_password

captive_portal:

# Gives us a local REST + SSE surface independent of Home Assistant, which is
# the standalone-Android-app path from the research notes. Coexists with the
# native API above, so both options stay open.
web_server:
  version: 3
  port: 80

button:
  - platform: restart
    name: Restart
    entity_category: config

text_sensor:
  - platform: wifi_info
    ip_address:
      name: IP Address
      entity_category: diagnostic

sensor:
  - platform: wifi_signal
    name: WiFi Signal
    update_interval: 60s
    entity_category: diagnostic
  - platform: uptime
    name: Uptime
    entity_category: diagnostic

  # Heap diagnostics. Added because an SD mount started failing right after a
  # second 768 KB online_image was introduced, and without these there was no
  # way to tell memory pressure apart from a hardware fault. Largest block
  # matters as much as the total: allocations fail on fragmentation long
  # before free memory runs out.
  - platform: template
    name: Free Internal Heap
    id: free_internal_heap
    unit_of_measurement: B
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 30s
    lambda: 'return heap_caps_get_free_size(MALLOC_CAP_INTERNAL);'

  - platform: template
    name: Largest Internal Block
    id: largest_internal_block
    unit_of_measurement: B
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 30s
    lambda: 'return heap_caps_get_largest_free_block(MALLOC_CAP_INTERNAL);'

  - platform: template
    name: Free PSRAM
    id: free_psram
    unit_of_measurement: B
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 30s
    lambda: 'return heap_caps_get_free_size(MALLOC_CAP_SPIRAM);' 
