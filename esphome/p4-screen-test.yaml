      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x00]

# Backlight is ACTIVE LOW on this board (the BSP sets LEDC output_invert), so
# a dark panel with a working DSI link looks exactly like a dead one.
output:
  - platform: ledc
    id: backlight_pwm
    pin:
      number: GPIO26
      inverted: true
    frequency: 5000Hz

light:
  - platform: monochromatic
    name: Backlight
    id: backlight
    output: backlight_pwm
    restore_mode: ALWAYS_ON
