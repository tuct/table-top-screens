      - [0xEB, 0x00, 0x00, 0x4E, 0x4E, 0x00, 0x00, 0x00]
      - [0xEC, 0x08, 0x01]
      - [0xED, 0xB0, 0x2B, 0x98, 0xA4, 0x56, 0x7F, 0xFF, 0xFF, 0xFF, 0xFF, 0xF7, 0x65, 0x4A, 0x89, 0xB2, 0x0B]
